name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: npm ci

    # 4️⃣ Build the project
    - name: Build project
      run: npm run build --if-present

    # 5️⃣ Add environment variables
    - name: Create .env file
      run: echo "${{ secrets.PROD_ENV }}" > .env

    # 6️⃣ Upload build to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}        # EC2 public IP
        username: ubuntu                 # EC2 username
        key: ${{ secrets.SSH_KEY }}      # EC2 PEM key content
        source: "./build/"               # Folder generated by npm run build
        target: "~/frontend/"            # Destination folder on EC2
        strip_components: 0
        recursive: true
